<style>
/* Layout: 見出し → タブ（日ごと／名前で見る）→ 日付・名前の切り替え → カード */
:root{
  --bg:#eff7f1; --surface:#ffffff; --line:#cfe5d5; --fg:#1f2a24; --muted:#5f6f66;
  --accent:#2f7d4f; --accent-fg:#ffffff; --accent-soft:#dcefe2; --tel:#c2456a; --tel-soft:#fbe2ea; --off:#8a8f8c; --we:#f6faf7; --memo:#a35a00; --memo-soft:#fdeccf; --tw:#b0279b; --tw-soft:#fbd9f4; --tw-cell:#fbd9f4;
  --font:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --num:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a15; --surface:#1b241e; --line:#2e3d33; --fg:#e6efe9; --muted:#9aaba0;
  --accent:#7cc79a; --accent-fg:#0f1a13; --accent-soft:#1f3527; --tel:#f08aa8; --tel-soft:#3c2430; --off:#7d857f; --we:#161f19; --memo:#f0b45a; --memo-soft:#3a2a12; --tw:#f39be3; --tw-soft:#4a2343; --tw-cell:#f8cdef; color-scheme:dark}}
*{box-sizing:border-box}
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header,nav,.toolbar,.dayhead,table.dt{max-width:880px;width:100%}
header{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
h1{font-size:1.35rem;line-height:1.35;margin:0;font-weight:700}
.back{display:flex;align-items:center;width:fit-content;min-height:40px;padding:6px 16px 6px 12px;margin-bottom:10px;border-radius:999px;font-size:1rem;font-weight:700;line-height:1.2;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);text-decoration:none}
.today{font-family:var(--num);color:var(--muted);font-size:.95rem}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
nav button{flex:1;border:0;background:none;font:inherit;font-weight:700;color:var(--muted);padding:10px 6px;border-radius:7px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:700;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.btn.primary{border-color:var(--accent);color:var(--accent)}
select{font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);max-width:100%}
.dayhead{font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:.85rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.now{background:var(--accent-soft);color:var(--accent)}
.pill.cnt{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:400}
.telcard{background:var(--tel-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.telcard b{color:var(--tel);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h3{margin:0 0 6px;font-size:1rem;display:flex;align-items:center;gap:8px}
.card h3 .n{font-family:var(--num);font-size:.85rem;color:var(--muted);font-weight:400}
.names{display:flex;flex-wrap:wrap;gap:6px}
.nm{background:var(--accent-soft);border-radius:8px;padding:3px 10px;font-size:.95rem}
.nm.tel{background:var(--tel-soft);color:var(--tel);font-weight:700}
.nm.tel::after{content:" TEL";font-size:.75rem}
.offcard{background:none;border-style:dashed}
.offcard .nm{background:none;border:1px solid var(--line);color:var(--off)}
.empty{color:var(--muted);text-align:center;padding:24px 0}
table{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 12px;border-top:1px solid var(--line);text-align:left;font-size:.95rem}
th{font-size:.82rem;color:var(--muted);background:var(--surface)}
td.d{font-family:var(--num);white-space:nowrap;width:6.5em}
tr.we td{background:var(--we);color:var(--muted)}
tr.now td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
tr.off td.duty{color:var(--off)}
.duty b{font-weight:700}
.telb{display:inline-block;margin-left:6px;font-size:.75rem;font-weight:700;color:var(--tel);background:var(--tel-soft);border-radius:6px;padding:0 6px}
.summary{display:flex;flex-wrap:wrap;gap:6px}
.help{color:var(--muted);font-size:.85rem;margin:0}
#view{display:flex;flex-direction:column;gap:12px}
/* 月の一覧（スプレッドシートと同じ並び：人×日） */
.mbox{overflow:auto;max-height:calc(100vh - 230px);background:var(--surface);border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
table.mt{border:0;border-radius:0;border-collapse:separate;border-spacing:0;width:max-content;overflow:visible}
table.mt th,table.mt td{border-top:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;font-size:.78rem;line-height:1.25}
table.mt thead th{position:sticky;top:0;z-index:2;background:var(--surface);padding:4px 0;font-family:var(--num);min-width:44px}
table.mt thead th .w{display:block;font-family:var(--font);font-weight:400}
table.mt th.nm,table.mt td.nm{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:0 8px;min-width:100px;max-width:100px;font-size:.8rem;border-radius:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
table.mt thead th.nm{z-index:3}
table.mt td.c{height:40px;min-width:44px;max-width:44px;vertical-align:middle}
table.mt th.sun{background:#fde3e8;color:#c2456a} table.mt th.sat{background:#e1ecfa;color:#2c6aa8}
table.mt td.sun{background:#fdf0f2} table.mt td.sat{background:#eef4fc}
@media (prefers-color-scheme: dark){table.mt th.sun{background:#3c2430;color:#f08aa8} table.mt th.sat{background:#1f3044;color:#7fb2e6} table.mt td.sun{background:#2a1c22} table.mt td.sat{background:#18222f}}
table.mt th.now{background:var(--accent);color:var(--accent-fg)} table.mt th.now .w{color:var(--accent-fg)}
table.mt td.now{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
.du{display:block;margin:0 2px;border-radius:5px;padding:3px 0;line-height:1.15;font-weight:700;color:#24302a;word-break:keep-all;overflow-wrap:anywhere}
.t{display:block;font-size:.62rem;font-weight:700;color:var(--tel);margin-top:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:.8rem}
.legend span{padding:2px 8px;border-radius:6px;color:#24302a}
/* 日ごと（コンパクト） */
table.dt td{vertical-align:top;line-height:1.75} table.dt{table-layout:fixed} table.dt td{padding-right:8px} table.dt td.k{width:5.6em;font-weight:700;white-space:nowrap}
table.dt td.k .n{display:block;font-weight:400;font-size:.8rem;color:var(--muted);font-family:var(--num)}
table.dt tr.tel td{background:var(--tel-soft)} table.dt tr.tel td.k{color:var(--tel)}
table.dt tr.off td{color:var(--off)}
table.mt td.nm.hc{background:var(--nc);color:#1f2a24;font-weight:700}
@media (prefers-color-scheme: dark){table.mt td.nm.hc{background:var(--surface);color:var(--fg);box-shadow:inset 7px 0 0 var(--nc);padding-left:14px}}
table.dt .dk{display:inline-block;margin:0;padding:1px 8px}
table.dt .nl{display:flex;align-items:baseline}table.dt .slot{flex:none;width:2.8em}table.dt .nm2{flex:1;min-width:0}
table.dt .telb{display:inline-block;margin:0;padding:0 5px;border-radius:6px;font-size:.72rem;line-height:1.6;font-weight:700;color:var(--surface);background:var(--tel);vertical-align:1px}
table.dt .tw{display:inline-block;margin-left:5px;padding:0 5px;border-radius:6px;font-size:.78rem;line-height:1.6;font-weight:700;color:var(--tw);background:var(--tw-soft);vertical-align:1px}
.twc{box-shadow:inset 0 0 0 1.5px var(--tw)}
table.dt .memo{display:inline-block;margin-left:5px;padding:0 5px;border-radius:6px;font-size:.78rem;line-height:1.6;font-weight:700;color:var(--memo);background:var(--memo-soft);vertical-align:1px}
table.mt td.hm{position:relative} table.mt td.hm::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent var(--memo) transparent transparent}

#status:empty{display:none}
.notice{border-radius:10px;padding:12px 14px;background:var(--accent-soft);font-size:.95rem}
</style>
</head><body>
<div class="wrap">
  <header><h1><a id="backMenu" class="back" href="index.html" hidden>‹ メニュー</a>シフト表</h1><span class="today" id="todayLabel"></span></header>
  <nav role="tablist">
    <button id="tab-day" role="tab" aria-selected="true" data-tab="day">今日</button>
    <button id="tab-month" role="tab" aria-selected="false" data-tab="month">今月</button>
    <button id="tab-next" role="tab" aria-selected="false" data-tab="next">次月</button>
  </nav>
  <div id="status"></div>
  <section id="view"></section>
</div>
<script>
const APP_MOD="kiroku";
/* ---- 通信と合言葉（N-SMART 沖縄事務所アプリ共通） ---- */
const IN_GAS=!!(window.google&&google.script&&google.script.run);
const API_URL=((window.APP_CONFIG||{}).urls||{})[APP_MOD]||"";
let KEY="";try{KEY=localStorage.getItem("passKey")||""}catch(e){}
function errCode(e){const m=String((e&&e.message)||e||"");const k=m.match(/(BADKEY|NOKEY|BUSY):/);return k?k[1]:""}
function errText(e){return String((e&&e.message)||e||"").replace(/^.*?(BADKEY|NOKEY|BUSY):/,"")}
function rawRpc(fn,args,key){
  if(IN_GAS)return new Promise((ok,ng)=>google.script.run.withSuccessHandler(ok).withFailureHandler(ng).rpc(fn,args,key));
  if(!API_URL){
    if(typeof MOCK!=="undefined"&&MOCK[fn])return new Promise((ok,ng)=>{try{ok(MOCK[fn](...args))}catch(e){ng(e)}});
    if(fn==="ping"&&typeof MOCK!=="undefined")return Promise.resolve(true);
    return Promise.reject(new Error("設定ファイル（config.js）にURLが入っていません"));
  }
  return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args,key})})
    .then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error);return j.data});
}
function rpc(fn,args){return rawRpc(fn,args||[],KEY).catch(e=>{const c=errCode(e);if(c==="BADKEY"||c==="NOKEY")showGate(c==="NOKEY"?errText(e):"合言葉が変わりました。新しい合言葉を入力してください。");throw e})}
function gateEsc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function showGate(msg){
  if(document.getElementById("gate"))return;
  if(!document.getElementById("gateCss")){const st=document.createElement("style");st.id="gateCss";st.textContent=`
#gate{position:fixed;inset:0;z-index:100;background:#f5f2fb;color:#221d2e;display:flex;align-items:center;justify-content:center;
 padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
 font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",Meiryo,system-ui,sans-serif}
#gate form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;text-align:center}
#gate h2{margin:0;font-size:1.2rem}#gate p{margin:0;color:#5d6a78;font-size:.92rem;line-height:1.6}
#gate .gi svg,#gate .gi img{width:88px;height:88px;border-radius:20px;display:block;margin:0 auto}
#gate input{font:inherit;font-size:1.1rem;padding:14px;border-radius:10px;border:1px solid #ddd5ee;background:#fff;color:#1d2733;text-align:center}
#gate button{font:inherit;font-weight:700;font-size:1.1rem;padding:14px;border-radius:10px;border:0;background:#6a4fa3;color:#fff;cursor:pointer}
#gate .ge{color:#a35a00;font-weight:700}
@media (prefers-color-scheme:dark){#gate{background:#17141f;color:#ece8f4}#gate p{color:#9aa7b4}#gate input{background:#211c2c;border-color:#3a3249;color:#e8edf2}#gate button{background:#b49be6;color:#1a1424}#gate .ge{color:#f0a94a}}`;document.head.appendChild(st)}
  const d=document.createElement("div");d.id="gate";
  d.innerHTML=`<form id="gateForm" autocomplete="off">
    <div class="gi" aria-hidden="true">${ICON_SVG}</div>
    <h2>N-SMART 沖縄事務所</h2>
    <p>はじめに、管理者から伝えられた合言葉を入力してください。次からは入力しなくても開けます。</p>
    <input id="gateKey" type="password" autocapitalize="off" spellcheck="false" placeholder="合言葉" aria-label="合言葉">
    <p id="gateErr" class="ge"${msg?"":" hidden"}>${gateEsc(msg||"")}</p>
    <button id="gateBtn">はじめる</button></form>`;
  document.body.appendChild(d);
  d.querySelector("form").addEventListener("submit",async e=>{
    e.preventDefault();
    const v=d.querySelector("#gateKey").value.trim(),err=d.querySelector("#gateErr"),btn=d.querySelector("#gateBtn");
    if(!v){err.textContent="合言葉を入力してください。";err.hidden=false;return}
    btn.disabled=true;btn.textContent="確認しています…";err.hidden=true;
    try{await rawRpc("ping",[],v);try{localStorage.setItem("passKey",v)}catch(x){}KEY=v;location.reload()}
    catch(x){btn.disabled=false;btn.textContent="はじめる";const c=errCode(x);
      err.textContent=c==="BADKEY"?"合言葉が違います。もう一度確かめてください。":c?errText(x):"つながりませんでした。電波のよい所で、もう一度押してください。";err.hidden=false}
  });
  setTimeout(()=>{const i=document.getElementById("gateKey");if(i)i.focus()},50);

/* PWAから開いたときだけ「メニューに戻る」を出す */
const IN_PWA=!IN_GAS&&!!API_URL;

const WD=["日","月","火","水","木","金","土"];
const pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const OFF=["有休","休","公休","希望休"];
const DUTY_COLOR={"総務":"#e6e0f7","テレ":"#dcebfb","特定":"#d9f0de","点検":"#fbe8c8","柔整":"#fbdde4","架電":"#d6eff5","浦添":"#efe4d0","発送":"#fff0b8","登録":"#e9e2d6","業者登録":"#e9e2d6","本社":"#e3e3e3","企画":"#efdcf4","有休":"#eeeeee"};
const dutyBg=d=>DUTY_COLOR[d]||"#ececec";
const short=d=>d.length>=4?d.slice(0,2)+"<br>"+d.slice(2):esc(d);
const now=new Date();
let tab="day", cur=new Date(now.getFullYear(),now.getMonth(),now.getDate()), months={}, me="";
try{me=localStorage.getItem("shiftMe")||localStorage.getItem("lastName")||""}catch(e){}

/* シートの表（1行目タイトル、3行目日付、4行目曜日、5行目から1人1行・1日2列：業務／TEL）を読み取る */
function parse(grid,notes,tele,nameBg,BASE,Y,M){
  notes=notes||{};BASE=BASE||{};nameBg=nameBg||[];const colors={};const TW=new Set(tele||[]);
  const days={},people=[];
  const r3=grid[2]||[];
  const cols=[];
  for(let c=1;c<r3.length;c++){const d=parseInt(r3[c],10);if(d>=1&&d<=31)cols.push([d,c])}
  for(let r=4;r<grid.length;r++){
    const row=grid[r]||[],name=String(row[0]||"").trim();
    if(!name)continue;
    people.push(name);
    const bg=String(nameBg[r]||"").toLowerCase();if(bg&&bg!=="#ffffff")colors[name]=bg;
    cols.forEach(([d,c])=>{
      const duty=String(row[c]||"").trim(),extra=String(row[c+1]||"").trim();
      if(!duty&&!extra)return;
      const memo=[notes[r+","+c],notes[r+","+(c+1)]].filter(Boolean).join(" ").replace(/\s+/g," ");
      const bt=!memo&&BASE[name]?BASE[name][new Date(Y,M-1,d).getDay()]||"":"";
      (days[d]=days[d]||[]).push({name,duty,memo:memo||bt,tw:TW.has(r+","+c),tel:/TEL/i.test(extra)||/TEL/i.test(duty)});
    });
  }
  // リーダー・サブリーダーだけ色を付ける：同じ色が3人以上いる色（メンバーの色）は付けない
  const cnt={};Object.values(colors).forEach(c=>cnt[c]=(cnt[c]||0)+1);
  Object.keys(colors).forEach(n=>{if(cnt[colors[n]]>=3)delete colors[n]});
  return {days,people,colors};
}
async function month(y,m){
  const k=`${y}-${pad(m)}`;
  if(months[k])return months[k];
  const res=await rpc("shiftGetMonth",[k]);
  months[k]=res&&res.grid?{...parse(res.grid,res.notes,res.tele,res.nameBg,res.base,y,m),found:true,hol:res.holidays||{}}:{days:{},people:[],found:false,hol:{}};
  return months[k];
}
function setStatus(m){$("status").innerHTML=m?`<div class="notice">${esc(m)}</div>`:""}

async function render(){
  for(const t of ["day","month","next"])$("tab-"+t).setAttribute("aria-selected",t===tab);
  const base=tab==="day"?cur:new Date(now.getFullYear(),now.getMonth()+(tab==="next"?1:0),1);
  const y=base.getFullYear(),m=base.getMonth()+1,el=$("view");
  let data;
  try{data=await month(y,m)}catch(e){if(errCode(e))return;el.innerHTML=`<p class="empty">シフト表を読み込めませんでした。開き直してください。</p>`;return}
  if(!data.found){el.innerHTML=(tab==="day"?nav():"")+`<p class="empty">${m}月のシフト表はまだありません。</p>`;return}
  el.innerHTML=tab==="day"?dayView(data,y,m):monthView(data,y,m);
  if(tab!=="day")scrollToToday();
}
function isToday(d){return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate()}
function nav(){
  return `<div class="toolbar"><button class="btn" data-mv="-1">‹ 前日</button><button class="btn" data-mv="1">翌日 ›</button>${isToday(cur)?"":`<button class="btn primary" data-mv="0">今日に戻る</button>`}</div>`;
}
function monthView(data,y,m){
  const days=new Date(y,m,0).getDate(), todayD=(y===now.getFullYear()&&m===now.getMonth()+1)?now.getDate():0;
  let head=`<th class="nm">${m}月</th>`;
  const kind=d=>{const w=new Date(y,m-1,d).getDay();return data.hol[d]||w===0?"sun":w===6?"sat":""};
  for(let d=1;d<=days;d++){const w=new Date(y,m-1,d).getDay();head+=`<th class="${kind(d)}${d===todayD?" now":""}" id="${d===todayD?"todayCol":""}" title="${esc(data.hol[d]||"")}">${d}<span class="w">${data.hol[d]?"祝":WD[w]}</span></th>`}
  const map={};Object.entries(data.days).forEach(([d,l])=>l.forEach(x=>{map[x.name+"|"+d]=x}));
  const used=new Set();
  const rows=data.people.map(n=>{
    const nc=data.colors&&data.colors[n];
    let r=`<td class="nm${nc?" hc":""}" title="${esc(n)}"${nc?` style="--nc:${nc}"`:""}>${esc(n)}</td>`;
    for(let d=1;d<=days;d++){
      const w=new Date(y,m-1,d).getDay(),e=map[n+"|"+d];
      if(e&&e.duty)used.add(e.duty);
      r+=`<td class="c ${kind(d)}${d===todayD?" now":""}${e&&e.memo?" hm":""}"${e&&e.memo?` title="${esc(e.memo)}"`:""}>${e&&e.duty?`<span class="du${e.tw?" twc":""}" style="background:${e.tw?"var(--tw-cell)":dutyBg(e.duty)}">${short(e.duty)}</span>`:""}${e&&e.tel?`<span class="t">TEL</span>`:""}</td>`;
    }
    return `<tr>${r}</tr>`;
  }).join("");
  const legend=[...used].map(d=>`<span style="background:${dutyBg(d)}">${esc(d)}</span>`).join("");
  return `<div class="mbox" id="mbox"><table class="mt"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="legend">${legend}<span class="twc" style="background:var(--tw-cell)">在宅</span><span style="color:var(--tel);font-weight:700;background:none;padding-left:2px">TEL＝TEL当番</span></div>
    <p class="help">表は左右・上下に動かせます。今日の列は緑、日曜・祝日は赤、土曜は青の列です。ピンクの枠は在宅です。</p>`;
}
function scrollToToday(){const c=$("todayCol"),b=$("mbox");if(c&&b)b.scrollLeft=Math.max(0,c.offsetLeft-100-44)}
function dayView(data,y,m){
  const d=cur.getDate(),list=(data.days[d]||[]);
  const work=list.filter(x=>x.duty&&!OFF.includes(x.duty)),off=list.filter(x=>OFF.includes(x.duty));
  const tel=list.filter(x=>x.tel);
  const groups={};work.forEach(x=>(groups[x.duty]=groups[x.duty]||[]).push(x));
  const who=x=>`<div class="nl"><span class="slot">${x.tel?`<span class="telb">TEL</span>`:""}</span><span class="nm2">${esc(x.name)}${x.tw?`<span class="tw">在宅</span>`:""}${x.memo?`<span class="memo">${esc(x.memo)}</span>`:""}</span></div>`;
  const order=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
  let h=nav()+`<div class="dayhead">${m}月${d}日（${data.hol[d]?"祝":WD[cur.getDay()]}）${data.hol[d]?`<span class="pill cnt">${esc(data.hol[d])}</span>`:""}${isToday(cur)?`<span class="pill now">今日</span>`:""}<span class="pill cnt">出勤 ${work.length}人${work.some(x=>x.tw)?`（在宅 ${work.filter(x=>x.tw).length}人）`:""}</span></div>`;
  if(!work.length&&!off.length)return h+`<p class="empty">この日のシフトはありません</p>`;
  let rows="";
  rows+=order.map(k=>`<tr><td class="k"><span class="du dk" style="background:${dutyBg(k)}">${esc(k)}</span><span class="n">${groups[k].length}人</span></td><td>${groups[k].map(who).join("")}</td></tr>`).join("");
  if(off.length)rows+=`<tr class="off"><td class="k">お休み</td><td>${off.map(x=>esc(x.name)+"（"+esc(x.duty)+"）").join("<br>")}</td></tr>`;
  return h+`<table class="dt"><tbody>${rows}</tbody></table>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();return}
  if(b.dataset.mv!==undefined){const v=+b.dataset.mv;cur=v===0?new Date(now.getFullYear(),now.getMonth(),now.getDate()):new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+v);render();return}
});
$("todayLabel").textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${WD[now.getDay()]}）`;
if(IN_PWA)$("backMenu").hidden=false;
if(KEY)render(); else showGate("");
</script>
