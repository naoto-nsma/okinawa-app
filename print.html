<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>印刷カウント｜N-SMART 沖縄事務所</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="N-SMART沖縄">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f2fb">
<script src="config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@700&display=swap">
<style>
/* Layout: 見出し → タブ（記録する／集計）→ 入力パネル＋最近の記録 ／ 月の合計＋顧客別＋カウンター */
:root{
  --bg:#f2f8f8; --surface:#ffffff; --line:#d3e3e4; --fg:#1d2b2c; --muted:#5f7073;
  --accent:#2a7f86; --accent-fg:#ffffff; --accent-soft:#d8eeef;
  --color:#c2456a; --color-soft:#fbe2ea; --mono:#3d4a4c; --mono-soft:#e6eaeb; --monobar:#8a979a;
  --warn:#a2620f; --ok:#2f7a4f;
  --font:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a1b; --surface:#1a2526; --line:#2c3c3e; --fg:#e4eeef; --muted:#97a9ab;
  --accent:#6cc3ca; --accent-fg:#0d1a1b; --accent-soft:#1d3537;
  --color:#f08aa8; --color-soft:#3c2430; --mono:#c9d3d5; --mono-soft:#263234; --monobar:#7f8f92;
  --warn:#e0a650; --ok:#6cc292; color-scheme:dark}}
*{box-sizing:border-box}
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
h1{font-size:1.35rem;line-height:1.35;margin:0;font-weight:700}
.back{display:flex;align-items:center;width:fit-content;min-height:40px;padding:6px 16px 6px 12px;margin-bottom:10px;border-radius:999px;font-size:1rem;font-weight:700;line-height:1.2;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);text-decoration:none}
.today{color:var(--muted);font-size:.95rem}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
nav button{flex:1;border:0;background:none;font:inherit;font-weight:700;color:var(--muted);padding:10px 6px;border-radius:7px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.lab{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:-4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.chip.more{color:var(--muted)}
select,input[type=text],input[type=date],input[type=number]{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;padding:4px;background:var(--bg);gap:4px}
.seg button{font:inherit;font-weight:700;border:0;background:none;color:var(--muted);padding:9px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border-radius:10px;padding:10px 10px 8px;min-width:0}
.box.c{background:var(--color-soft)} .box.m{background:var(--mono-soft)}
.box .t{font-size:13px;font-weight:700} .box.c .t{color:var(--color)} .box.m .t{color:var(--mono)}
.step{display:flex;align-items:center;gap:6px;margin-top:6px}
.step button{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.step input{flex:1;min-width:0;text-align:center;font-size:22px;-moz-appearance:textfield;appearance:textfield;font-weight:700;padding:4px 2px;background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;font-variant-numeric:tabular-nums}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);margin-top:4px;min-height:1.2em}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.sum span{font-size:14px;font-weight:700}
.sum b{font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.calc{font-size:12px;color:var(--muted);text-align:right;margin-top:-8px}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:14px;cursor:pointer;background:var(--accent);color:var(--accent-fg);font-size:16px;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.msg{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--color-soft)}
.msg.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
h2{font-size:1rem;margin:0}
ul.rec{list-style:none;margin:0;padding:0}
ul.rec li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
ul.rec li:last-child{border-bottom:0}
.rmain{flex:1;min-width:0}
.rmain small{display:block;color:var(--muted);font-size:12px}
.rnum{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:4px}
.tag.c{background:var(--color-soft);color:var(--color)} .tag.m{background:var(--mono-soft);color:var(--mono)}
.fixb{flex:none;font:inherit;font-size:13px;font-weight:600;color:var(--accent);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.fix{flex-basis:100%;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.fix .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fix label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.fix .acts{display:flex;gap:8px}
.fix .ask{font-size:14px;font-weight:700;color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:14px}
.month{display:flex;justify-content:space-between;align-items:center;gap:8px}
.month b{font-size:1.15rem}
.month button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer}
.month button:disabled{opacity:.35;cursor:default}
.big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.big div{background:var(--surface);padding:10px 12px;min-width:0}
.big .k{font-size:12px;color:var(--muted)} .big .v{font-size:18px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.cr{padding:10px 0;border-bottom:1px solid var(--line)} .cr:last-child{border-bottom:0}
.cr .top{display:flex;justify-content:space-between;gap:10px}
.cr .top b{font-variant-numeric:tabular-nums}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--bg);margin:6px 0 4px}
.bar i{display:block}.bar .c{background:var(--color)}.bar .m{background:var(--monobar)}
.cr small{color:var(--muted);font-size:12px}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.ctr{font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}.ctr .hd2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ctr:last-child{border-bottom:0}
.ctr .lack{font-weight:700}
.ctr .lack.bad{color:var(--warn)} .ctr .lack.good{color:var(--ok)}
.foot{font-size:12px;color:var(--muted);text-align:center}
.foot a{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a id="backMenu" class="back" href="index.html" hidden>‹ メニュー</a>
    <h1>印刷カウント</h1>
    <span class="today" id="todayLabel"></span>
  </header>
  <nav role="tablist">
    <button role="tab" id="tabRec" aria-selected="true">記録する</button>
    <button role="tab" id="tabSum" aria-selected="false">集計</button>
  </nav>

  <section id="viewRec">
    <div class="panel">
      <div class="lab">印刷した人</div>
      <div class="chips" id="who"><span class="note">読み込み中…</span></div>
      <div class="lab">顧客</div>
      <select id="cust"><option value="">読み込み中…</option></select>
      <div class="lab">印刷のしかた</div>
      <div class="seg" id="side"><button type="button" data-v="片面" aria-pressed="true">片面</button><button type="button" data-v="両面" aria-pressed="false">両面</button></div>
      <div class="lab">用紙の枚数</div>
      <div class="cnt">
        <div class="box c"><div class="t">カラー</div><div class="step"><button type="button" data-d="-1" data-t="nColor" aria-label="カラーを1枚減らす">−</button><input id="nColor" type="number" inputmode="numeric" min="0" step="1" placeholder="0" aria-label="カラーの枚数"><button type="button" data-d="1" data-t="nColor" aria-label="カラーを1枚増やす">＋</button></div><div class="unit" id="uColor"></div></div>
        <div class="box m"><div class="t">モノクロ</div><div class="step"><button type="button" data-d="-1" data-t="nMono" aria-label="モノクロを1枚減らす">−</button><input id="nMono" type="number" inputmode="numeric" min="0" step="1" placeholder="0" aria-label="モノクロの枚数"><button type="button" data-d="1" data-t="nMono" aria-label="モノクロを1枚増やす">＋</button></div><div class="unit" id="uMono"></div></div>
      </div>
      <div class="sum"><span>この印刷の費用（税込）</span><b id="cost">¥0</b></div>
      <div class="calc" id="calc"></div>
      <div class="lab">内容（任意）</div>
      <input type="text" id="memo" placeholder="受診勧奨通知、社内資料など">
      <div id="msg" class="msg" hidden></div>
      <button class="btn" id="saveBtn" disabled>読み込み中…</button>
    </div>
    <div class="panel" style="margin-top:14px">
      <h2>最近の記録</h2>
      <ul class="rec" id="recent"><li class="empty">読み込み中…</li></ul>
    </div>
  </section>

  <section id="viewSum" hidden>
    <div class="month"><button type="button" id="mPrev" aria-label="前の月">‹</button><span style="text-align:center"><b id="mLabel"></b><small id="mRange" style="display:block;color:var(--muted);font-size:.85rem"></small></span><button type="button" id="mNext" aria-label="次の月">›</button></div>
    <div class="big" style="margin-top:12px">
      <div><div class="k">カラー</div><div class="v" id="tC" style="color:var(--color)">―</div></div>
      <div><div class="k">モノクロ</div><div class="v" id="tM">―</div></div>
      <div><div class="k">費用（税込）</div><div class="v" id="tCost" style="color:var(--accent)">―</div></div>
    </div>
    <div class="panel" style="margin-top:14px">
      <h2>顧客別（費用の多い順）</h2>
      <div id="custList"><p class="empty">読み込み中…</p></div>
      <p class="note">枚数はカウント（両面は表裏で2）です。<span id="priceNote"></span></p>
    </div>
    <div class="panel" style="margin-top:14px">
      <h2>複合機のカウンター</h2>
      <p class="note">月末に、複合機に表示される累計のカウンターを入れてください。前回からの増え方とアプリの記録を比べて、記録漏れがわかります。</p>
      <div id="ctrList"></div>
      <div class="cnt">
        <label class="box c" style="display:block"><span class="t">カラー</span><input id="kColor" type="number" inputmode="numeric" min="0" step="1" style="margin-top:6px;background:var(--surface)"></label>
        <label class="box m" style="display:block"><span class="t">モノクロ</span><input id="kMono" type="number" inputmode="numeric" min="0" step="1" style="margin-top:6px;background:var(--surface)"></label>
      </div>
      <div id="kMsg" class="msg" hidden></div>
      <button class="btn" id="kBtn">カウンターを記録する</button>
    </div>
  </section>
</div>

<script>
const APP_MOD="print";
/* ---- 通信と合言葉（N-SMART 沖縄事務所アプリ共通） ---- */
const IN_GAS=!!(window.google&&google.script&&google.script.run);
const API_URL=((window.APP_CONFIG||{}).urls||{})[APP_MOD]||"";
let KEY="";try{KEY=localStorage.getItem("passKey")||""}catch(e){}
function errCode(e){const m=String((e&&e.message)||e||"");const k=m.match(/(BADKEY|NOKEY|BUSY):/);return k?k[1]:""}
function errText(e){return String((e&&e.message)||e||"").replace(/^.*?(BADKEY|NOKEY|BUSY):/,"")}
function rawRpc(fn,args,key){
  if(IN_GAS)return new Promise((ok,ng)=>google.script.run.withSuccessHandler(ok).withFailureHandler(ng).rpc(fn,args,key));
  if(!API_URL){
    if(typeof MOCK!=="undefined"&&MOCK[fn])return new Promise((ok,ng)=>{try{ok(MOCK[fn](...args))}catch(e){ng(e)}});
    if(fn==="ping"&&typeof MOCK!=="undefined")return Promise.resolve(true);
    return Promise.reject(new Error("設定ファイル（config.js）にURLが入っていません"));
  }
  return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args,key})})
    .then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error);return j.data});
}
function rpc(fn,args){return rawRpc(fn,args||[],KEY).catch(e=>{const c=errCode(e);if(c==="BADKEY"||c==="NOKEY")showGate(c==="NOKEY"?errText(e):"合言葉が変わりました。新しい合言葉を入力してください。");throw e})}
function gateEsc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function showGate(msg){
  if(document.getElementById("gate"))return;
  if(!document.getElementById("gateCss")){const st=document.createElement("style");st.id="gateCss";st.textContent=`
#gate{position:fixed;inset:0;z-index:100;background:#f5f2fb;color:#221d2e;display:flex;align-items:center;justify-content:center;
 padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
 font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",Meiryo,system-ui,sans-serif}
#gate form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;text-align:center}
#gate h2{margin:0;font-size:1.2rem}#gate p{margin:0;color:#5d6a78;font-size:.92rem;line-height:1.6}
#gate .gi svg,#gate .gi img{width:88px;height:88px;border-radius:20px;display:block;margin:0 auto}
#gate input{font:inherit;font-size:1.1rem;padding:14px;border-radius:10px;border:1px solid #ddd5ee;background:#fff;color:#1d2733;text-align:center}
#gate button{font:inherit;font-weight:700;font-size:1.1rem;padding:14px;border-radius:10px;border:0;background:#6a4fa3;color:#fff;cursor:pointer}
#gate .ge{color:#a35a00;font-weight:700}
@media (prefers-color-scheme:dark){#gate{background:#17141f;color:#ece8f4}#gate p{color:#9aa7b4}#gate input{background:#211c2c;border-color:#3a3249;color:#e8edf2}#gate button{background:#b49be6;color:#1a1424}#gate .ge{color:#f0a94a}}`;document.head.appendChild(st)}
  const d=document.createElement("div");d.id="gate";
  d.innerHTML=`<form id="gateForm" autocomplete="off">
    <div class="gi" aria-hidden="true">${ICON_SVG}</div>
    <h2>N-SMART 沖縄事務所</h2>
    <p>はじめに、管理者から伝えられた合言葉を入力してください。次からは入力しなくても開けます。</p>
    <input id="gateKey" type="password" autocapitalize="off" spellcheck="false" placeholder="合言葉" aria-label="合言葉">
    <p id="gateErr" class="ge"${msg?"":" hidden"}>${gateEsc(msg||"")}</p>
    <button id="gateBtn">はじめる</button></form>`;
  document.body.appendChild(d);
  d.querySelector("form").addEventListener("submit",async e=>{
    e.preventDefault();
    const v=d.querySelector("#gateKey").value.trim(),err=d.querySelector("#gateErr"),btn=d.querySelector("#gateBtn");
    if(!v){err.textContent="合言葉を入力してください。";err.hidden=false;return}
    btn.disabled=true;btn.textContent="確認しています…";err.hidden=true;
    try{await rawRpc("ping",[],v);try{localStorage.setItem("passKey",v)}catch(x){}KEY=v;location.reload()}
    catch(x){btn.disabled=false;btn.textContent="はじめる";const c=errCode(x);
      err.textContent=c==="BADKEY"?"合言葉が違います。もう一度確かめてください。":c?errText(x):"つながりませんでした。電波のよい所で、もう一度押してください。";err.hidden=false}
  });

/* PWAから開いたときだけ「メニューに戻る」を出す */
const IN_PWA=!IN_GAS&&!!API_URL;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen=n=>"¥"+(Math.round(Number(n)||0)).toLocaleString("ja-JP");
const unit=n=>"¥"+(Number(n)||0).toLocaleString("ja-JP",{maximumFractionDigits:3});
const fmt=n=>(Math.round(Number(n)||0)).toLocaleString("ja-JP");
const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let S={staff:[],customers:[],prices:{color:0,mono:0},recent:[]},who=store("print_who")||"",side=store("print_side")||"片面",showAll=false,ym="";

function showMsg(id,t,ok){const m=$(id);m.textContent=t||"";m.className="msg"+(ok?" ok":"");m.hidden=!t}
function intv(id){const n=Math.round(Number($(id).value));return isFinite(n)&&n>0?n:0}

/* ---- 記録する ---- */
function renderWho(){
  let list=S.staff.slice();const i=list.indexOf(who);if(i>0){list.splice(i,1);list.unshift(who)}
  const many=list.length>8&&!showAll;const shown=many?list.slice(0,6):list;
  $("who").innerHTML=list.length?shown.map(n=>`<button type="button" class="chip" aria-pressed="${n===who}" data-n="${esc(n)}">${esc(n)}</button>`).join("")+(many?`<button type="button" class="chip more" id="moreWho">ほかの人（${list.length-6}人）</button>`:""):`<span class="note">☆N-SMART沖縄アプリの「名前」シートに名前を入れてください</span>`;
}
$("who").addEventListener("click",e=>{
  if(e.target.id==="moreWho"){showAll=true;renderWho();return}
  const b=e.target.closest(".chip[data-n]");if(!b)return;who=b.dataset.n;store("print_who",who);renderWho();
});
function renderCust(){
  const last=store("print_cust");let list=S.customers.slice();const i=list.indexOf(last);if(i>0){list.splice(i,1);list.unshift(last)}
  $("cust").innerHTML=`<option value="">選んでください</option>`+list.map(c=>`<option${c===last?" selected":""}>${esc(c)}</option>`).join("");
}
function renderSide(){$("side").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===side)))}
$("side").addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(!b)return;side=b.dataset.v;store("print_side",side);renderSide();recalc()});
document.querySelectorAll(".step button").forEach(b=>b.addEventListener("click",()=>{const t=$(b.dataset.t);t.value=Math.max(0,(Number(t.value)||0)+Number(b.dataset.d))||"";recalc()}));
["nColor","nMono"].forEach(id=>$(id).addEventListener("input",recalc));
function recalc(){
  const k=side==="両面"?2:1,c=intv("nColor")*k,m=intv("nMono")*k,p=S.prices;
  $("uColor").textContent=intv("nColor")?(k===2?"両面 → ":"")+fmt(c)+"カウント":"1カウント "+unit(p.color);
  $("uMono").textContent=intv("nMono")?(k===2?"両面 → ":"")+fmt(m)+"カウント":"1カウント "+unit(p.mono);
  $("cost").textContent=yen(c*p.color+m*p.mono);
  const parts=[];if(c)parts.push("カラー "+fmt(c)+"×"+unit(p.color));if(m)parts.push("モノクロ "+fmt(m)+"×"+unit(p.mono));
  $("calc").textContent=parts.join(" ＋ ");
}
$("saveBtn").addEventListener("click",()=>{
  const p={who,customer:$("cust").value,side,color:intv("nColor"),mono:intv("nMono"),memo:$("memo").value.trim()};
  if(!p.who)return showMsg("msg","印刷した人を選んでください");
  if(!p.customer)return showMsg("msg","顧客を選んでください");
  if(!p.color&&!p.mono)return showMsg("msg","カラーかモノクロの枚数を入れてください");
  const b=$("saveBtn");b.disabled=true;b.textContent="記録中…";showMsg("msg","");
  rpc("saveEntry",[p]).then(r=>{
    store("print_cust",p.customer);S.recent=r.recent;renderRecent();
    showMsg("msg","記録しました："+p.customer+" "+yen(r.cost),true);
    $("nColor").value="";$("nMono").value="";$("memo").value="";recalc();renderCust();
  }).catch(e=>{if(!errCode(e))showMsg("msg","記録できませんでした："+errText(e))}).finally(()=>{b.disabled=false;b.textContent="記録する"});
});

function renderRecent(){
  $("recent").innerHTML=S.recent.length?S.recent.slice(0,15).map((r,i)=>`<li data-i="${i}"><span class="rmain">${esc(r.customer)}<small>${esc(r.date)}　${esc(r.who)}　${esc(r.side)}${r.memo?"　"+esc(r.memo):""}</small></span>
    <span class="rnum">${r.colorCount?`<span class="tag c">カ ${fmt(r.colorCount)}</span>`:""}${r.monoCount?`<span class="tag m">モ ${fmt(r.monoCount)}</span>`:""}<br><b>${yen(r.cost)}</b></span>
    <button type="button" class="fixb">直す</button></li>`).join(""):`<li class="empty">まだ記録がありません</li>`;
}
$("recent").addEventListener("click",e=>{
  const li=e.target.closest("li[data-i]");if(!li||e.target.closest(".fix")||!e.target.closest(".fixb"))return;
  const open=li.querySelector(".fix");document.querySelectorAll("#recent .fix").forEach(f=>f.remove());if(open)return;
  const r=S.recent[Number(li.dataset.i)];
  const opts=S.customers.indexOf(r.customer)>=0?S.customers:[r.customer].concat(S.customers);
  const f=document.createElement("div");f.className="fix";
  f.innerHTML=`<label>日付<input type="date" class="x-date" value="${esc(r.day)}"></label>
    <label>顧客<select class="x-cust">${opts.map(c=>`<option${c===r.customer?" selected":""}>${esc(c)}</option>`).join("")}</select></label>
    <div class="seg x-side"><button type="button" data-v="片面" aria-pressed="${r.side!=="両面"}">片面</button><button type="button" data-v="両面" aria-pressed="${r.side==="両面"}">両面</button></div>
    <div class="two"><label>カラー（枚）<input type="number" class="x-c" inputmode="numeric" min="0" value="${r.color||""}"></label><label>モノクロ（枚）<input type="number" class="x-m" inputmode="numeric" min="0" value="${r.mono||""}"></label></div>
    <label>内容<input type="text" class="x-memo" value="${esc(r.memo)}"></label>
    <div class="msg x-msg" hidden></div>
    <div class="acts"><button type="button" class="btn x-save">訂正を保存</button><button type="button" class="btn ghost x-cancel">やめる</button></div>
    <div class="acts"><button type="button" class="btn danger x-del">この記録を削除</button></div>`;
  li.appendChild(f);
  const q=c=>f.querySelector(c),fm=t=>{const m=q(".x-msg");m.textContent=t;m.hidden=!t};
  let xs=r.side==="両面"?"両面":"片面";
  q(".x-side").addEventListener("click",ev=>{const b=ev.target.closest("button[data-v]");if(!b)return;xs=b.dataset.v;q(".x-side").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===xs)))});
  const me=()=>{if(!who)fm("上の「印刷した人」で自分の名前を選んでから、もう一度押してください");return who};
  q(".x-cancel").onclick=()=>f.remove();
  q(".x-save").onclick=function(){
    if(!me())return;const b=this;b.disabled=true;b.textContent="保存中…";
    rpc("updateEntry",[{id:r.id,date:q(".x-date").value,customer:q(".x-cust").value,side:xs,color:q(".x-c").value,mono:q(".x-m").value,memo:q(".x-memo").value.trim(),who}])
      .then(res=>{S.recent=res.recent;renderRecent();showMsg("msg","訂正しました："+q(".x-cust").value,true)})
      .catch(err=>{if(!errCode(err)){fm("訂正できませんでした："+errText(err));b.disabled=false;b.textContent="訂正を保存"}});
  };
  q(".x-del").onclick=function(){
    if(!me())return;const box=this.parentNode;
    box.innerHTML=`<div class="ask" style="flex-basis:100%">「${esc(r.customer)} ${yen(r.cost)}」を削除します。よろしいですか？</div>`;
    box.style.flexWrap="wrap";
    box.insertAdjacentHTML("beforeend",`<button type="button" class="btn danger x-yes" style="flex:1">削除する</button><button type="button" class="btn ghost x-no" style="flex:1">やめる</button>`);
    box.querySelector(".x-no").onclick=()=>f.remove();
    box.querySelector(".x-yes").onclick=function(){const b=this;b.disabled=true;b.textContent="削除中…";
      rpc("deleteEntry",[{id:r.id,who}]).then(res=>{S.recent=res.recent;renderRecent();showMsg("msg","削除しました："+r.customer+" "+yen(r.cost),true)})
        .catch(err=>{if(!errCode(err)){fm("削除できませんでした："+errText(err));b.disabled=false;b.textContent="削除する"}})};
  };
});

/* ---- 集計 ---- */
function ymNow(){if(S.ymNow)return S.ymNow;const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function ymAdd(v,n){let y=+v.slice(0,4),m=+v.slice(5,7)+n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+String(m).padStart(2,"0")}
function loadSum(){
  $("mLabel").textContent=+ym.slice(0,4)+"年"+(+ym.slice(5,7))+"月分";$("mRange").textContent="";$("mNext").disabled=ym>=ymNow();
  $("custList").innerHTML=`<p class="empty">読み込み中…</p>`;
  rpc("getSummary",[ym]).then(renderSum).catch(e=>{if(!errCode(e))$("custList").innerHTML=`<p class="empty">読み込めませんでした。開き直してください。</p>`});
}
function renderSum(d){
  $("mRange").textContent=d.range||"";
  $("tC").textContent=fmt(d.total.cc);$("tM").textContent=fmt(d.total.mc);$("tCost").textContent=yen(d.total.cost);
  const max=Math.max(1,...d.customers.map(c=>c.cost));
  $("custList").innerHTML=d.customers.length?d.customers.map(c=>{
    const cw=c.cc*d.prices.color,mw=c.mc*d.prices.mono,t=Math.max(1,cw+mw),w=c.cost/max*100;
    return `<div class="cr"><div class="top"><span>${esc(c.customer)}</span><b>${yen(c.cost)}</b></div>
      <div class="bar"><i class="c" style="width:${(w*cw/t).toFixed(1)}%"></i><i class="m" style="width:${(w*mw/t).toFixed(1)}%"></i></div>
      <small>カラー ${fmt(c.cc)} ・ モノクロ ${fmt(c.mc)}（${c.n}件）</small></div>`}).join(""):`<p class="empty">この月の記録はまだありません</p>`;
  $("priceNote").textContent="今の単価（税込）：カラー "+unit(d.prices.color)+"・モノクロ "+unit(d.prices.mono);
  const k=d.counter||{entries:[]};
  $("ctrList").innerHTML=k.entries.length?k.entries.map(e=>{
    const lk=(e.lackC==null&&e.lackM==null)?`<span class="lack">はじめての入力</span>`:
      `<span class="lack ${(e.lackC||0)+(e.lackM||0)>0?"bad":"good"}">${(e.lackC||0)+(e.lackM||0)>0?"記録漏れ カラー "+fmt(Math.max(0,e.lackC))+"・モノクロ "+fmt(Math.max(0,e.lackM)):"記録漏れなし"}</span>`;
    return `<div class="ctr"><div class="hd2"><span>${esc(e.at)}</span>${lk}</div><div class="note">カウンター：カラー ${fmt(e.color)}・モノクロ ${fmt(e.mono)}（${esc(e.who)}）</div></div>`}).join(""):`<p class="note">まだ入力がありません。最初の入力が基準になり、次の入力から差がわかります。</p>`;
  if(k.lastColor!=null){$("kColor").placeholder="前回 "+fmt(k.lastColor);$("kMono").placeholder="前回 "+fmt(k.lastMono)}
}
$("mPrev").onclick=()=>{ym=ymAdd(ym,-1);loadSum()};
$("mNext").onclick=()=>{if(ym<ymNow()){ym=ymAdd(ym,1);loadSum()}};
$("kBtn").onclick=()=>{
  if(!who)return showMsg("kMsg","「記録する」タブで自分の名前を選んでから、もう一度押してください");
  const p={color:intv("kColor"),mono:intv("kMono"),who,ym};
  if(!p.color&&!p.mono)return showMsg("kMsg","カウンターの数字を入れてください");
  const b=$("kBtn");b.disabled=true;b.textContent="記録中…";showMsg("kMsg","");
  rpc("saveCounter",[p]).then(d=>{renderSum(d);$("kColor").value="";$("kMono").value="";showMsg("kMsg","カウンターを記録しました",true)})
    .catch(e=>{if(!errCode(e))showMsg("kMsg",errText(e))}).finally(()=>{b.disabled=false;b.textContent="カウンターを記録する"});
};

function tab(t){const rec=t==="rec";$("tabRec").setAttribute("aria-selected",rec);$("tabSum").setAttribute("aria-selected",!rec);$("viewRec").hidden=!rec;$("viewSum").hidden=rec;if(!rec){if(!ym)ym=ymNow();loadSum()}}
$("tabRec").onclick=()=>tab("rec");$("tabSum").onclick=()=>tab("sum");

function start(){
  renderSide();
  rpc("getInit",[]).then(r=>{
    S=r;if(who&&S.staff.indexOf(who)<0)who="";
    renderWho();renderCust();renderRecent();recalc();
    $("saveBtn").disabled=false;$("saveBtn").textContent="記録する";
    if(!S.customers.length)showMsg("msg","顧客がまだありません。スプレッドシートの「設定」を確認してください");
  }).catch(e=>{if(!errCode(e))showMsg("msg","読み込めませんでした："+errText(e))});
}
(function(){const n=new Date(),W=["日","月","火","水","木","金","土"];$("todayLabel").textContent=n.getFullYear()+"年"+(n.getMonth()+1)+"月"+n.getDate()+"日（"+W[n.getDay()]+"）"})();
if(IN_PWA)$("backMenu").hidden=false;
if(KEY)start(); else showGate("");
</script>
</body>
</html>
